name: E2E iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prebuild iOS
        run: pnpm expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: deriveddata-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: deriveddata-

      - name: Prepare Simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available

          if ! xcrun simctl list runtimes | grep -q "com.apple.CoreSimulator.SimRuntime.iOS"; then
            echo "No iOS runtime found, downloading..."
            xcodebuild -downloadPlatform iOS
          fi

          RUNTIME_ID=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
          echo "Using runtime: $RUNTIME_ID"

          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            xcrun simctl create "iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME_ID"
          fi

          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16" -b

      - name: Build for Simulator
        run: |
          xcodebuild \
            -workspace ios/runnerd.xcworkspace \
            -scheme runnerd \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run E2E tests
        run: |
          APP_PATH="build/Build/Products/Release-iphonesimulator/runnerd.app"
          ls -la "$APP_PATH"
          xcrun simctl install "iPhone 16" "$APP_PATH"
          maestro test --format junit --output maestro-report.xml e2e/ 2>&1 | tee maestro-output.log

      - name: Emit failure details as annotations
        if: failure()
        run: |
          if [ -f maestro-output.log ]; then
            CONTENT=$(cat maestro-output.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Maestro output::$CONTENT"
          fi
          if [ -f maestro-report.xml ]; then
            CONTENT=$(cat maestro-report.xml | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Maestro report::$CONTENT"
          fi

      - name: Screenshot on failure
        if: failure()
        run: xcrun simctl io "iPhone 16" screenshot screenshot.png

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            screenshot.png
            maestro-report.xml
            ~/.maestro/tests/**/*
