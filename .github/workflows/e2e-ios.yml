name: E2E iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prebuild iOS
        run: pnpm expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: deriveddata-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Prepare Simulator
        run: |
          if ! xcrun simctl list runtimes | grep -q "com.apple.CoreSimulator.SimRuntime.iOS"; then
            xcodebuild -downloadPlatform iOS
          fi
          RUNTIME=$(xcrun simctl list runtimes | grep "com.apple.CoreSimulator.SimRuntime.iOS" | tail -1 | sed 's/.*- //' | sed 's/ (.*//')
          RUNTIME_ID=$(xcrun simctl list runtimes | grep "com.apple.CoreSimulator.SimRuntime.iOS" | tail -1 | awk -F '[()]' '{print $(NF-1)}')
          echo "Runtime: $RUNTIME ($RUNTIME_ID)"
          if ! xcrun simctl list devices "$RUNTIME" | grep -q "iPhone 16"; then
            xcrun simctl create "iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME_ID"
          fi
          xcrun simctl boot "iPhone 16" || true
          xcrun simctl bootstatus "iPhone 16" -b

      - name: Build for Simulator
        run: |
          xcodebuild \
            -workspace ios/runnerd.xcworkspace \
            -scheme runnerd \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run E2E tests
        run: |
          APP_PATH=$(find build -name "*.app" -path "*/Release-iphonesimulator/*" | head -1)
          echo "APP_PATH: $APP_PATH"
          xcrun simctl install "iPhone 16" "$APP_PATH"
          maestro test --format junit --output maestro-report.xml e2e/

      - name: Screenshot on failure
        if: failure()
        run: xcrun simctl io "iPhone 16" screenshot screenshot.png

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            screenshot.png
            maestro-report.xml
            ~/.maestro/tests/**/*
