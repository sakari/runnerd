appId: com.runnerd.app

---

- launchApp:
    permissions:
      location: always
      notifications: allow

# Verify timer screen loaded with initial state
- assertVisible: "00:00"
- assertVisible: "30 min"

# Verify both tabs exist
- assertVisible:
    id: "tab-run"
- assertVisible:
    id: "tab-history"

# Navigate to History tab and back
- tapOn:
    id: "tab-history"
- tapOn:
    id: "tab-run"
