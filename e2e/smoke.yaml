appId: com.runnerd.app
# E2E smoke test for iOS Simulator

---

- launchApp:
    permissions:
      location: always
      notifications: allow

# Verify timer screen loaded
- assertVisible: "00:00"
- assertVisible: "30m"
- assertVisible: "60m"

# Verify both tabs exist
- assertVisible:
    id: "tab-run"
- assertVisible:
    id: "tab-history"

# Navigate to History tab
- tapOn:
    id: "tab-history"

# Navigate back to Run tab
- tapOn:
    id: "tab-run"

# Select a duration preset
- tapOn: "30m"
- assertVisible: "30 min target"

# Deselect it
- tapOn: "30m"
- assertNotVisible: "30 min target"
