appId: com.runnerd.app

# Tip jar, exercised against the RevenueCat Test Store.
#
# Unconditional: REVENUECAT_TEST_KEY is set, so a missing tip button is a real
# failure rather than a reason to skip. Requires the dashboard to have a
# non-subscription product in the `default` offering, attached to the
# `supporter` entitlement.
---
- launchApp:
    clearState: true
    permissions:
      location: always
      notifications: allow

- tapOn:
    id: "tab-history"

# The widget only renders once CustomerInfo resolves, so this is also the
# assertion that the SDK configured and reached RevenueCat at all.
- assertVisible:
    id: "tip-open"

# Cancelling must leave the widget exactly as it was.
- tapOn:
    id: "tip-open"
- assertVisible:
    id: "tip-confirm"
- tapOn:
    id: "tip-confirm"
- tapOn: "Cancel"
- tapOn:
    id: "tip-close"
- assertVisible:
    id: "tip-open"
- assertNotVisible:
    id: "tip-supporter"

# A failed purchase must report itself and leave the widget tappable.
- tapOn:
    id: "tip-open"
- tapOn:
    id: "tip-confirm"
- tapOn: "Simulate failure"
- assertVisible:
    id: "tip-failed"
- tapOn:
    id: "tip-close"
- assertVisible:
    id: "tip-open"
- assertNotVisible:
    id: "tip-supporter"

# A successful tip swaps the button for the badge, permanently.
- tapOn:
    id: "tip-open"
- tapOn:
    id: "tip-confirm"
- tapOn: "Simulate purchase"
- assertVisible:
    id: "tip-thanks"
- tapOn:
    id: "tip-close"
- assertVisible:
    id: "tip-supporter"
- assertNotVisible:
    id: "tip-open"

# Relaunch WITHOUT clearState: supporter status must survive a restart.
- launchApp:
    clearState: false
- tapOn:
    id: "tab-history"
- assertVisible:
    id: "tip-supporter"
- assertNotVisible:
    id: "tip-open"
